services:
  # ---------- BASE DE DATOS: PostgreSQL ----------
  db:
    image: postgres:16
    container_name: app1-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app1-db-data:/var/lib/postgresql/data
    networks:
      - app1-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------- CACHE / BROKER: Redis ----------
  redis:
    image: redis:7-alpine
    container_name: app1-redis
    restart: always
    networks:
      - app1-internal
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- BACKEND: Django (Gunicorn) ----------
  backend:
    build: ./backend
    container_name: app1-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_HOSTS: api.app1.academia.ar,app1.academia.ar,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: https://app1.academia.ar
      CSRF_TRUSTED_ORIGINS: https://app1.academia.ar,https://api.app1.academia.ar
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      FRONTEND_URL: https://app1.academia.ar
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      VIRTUAL_HOST: api.app1.academia.ar
      VIRTUAL_PORT: 8000
      LETSENCRYPT_HOST: api.app1.academia.ar
      LETSENCRYPT_EMAIL: admin@academia.ar
    volumes:
      - media_files:/app/media
    networks:
      - nginx-proxy
      - app1-internal
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --worker-class gevent --workers 3 --worker-connections 1000 --timeout 120 --bind 0.0.0.0:8000 config.wsgi:application"
    deploy:
      resources:
        limits:
          memory: 384m

  # ---------- CELERY worker ----------
  celery-worker:
    build: ./backend
    container_name: app1-celery-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    networks:
      - app1-internal
    command: celery -A config worker -l info -Q default
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------- CELERY beat ----------
  celery-beat:
    build: ./backend
    container_name: app1-celery-beat
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    networks:
      - app1-internal
    command: celery -A config beat -l info
    deploy:
      resources:
        limits:
          memory: 128m

  # ---------- FRONTEND: React + Nginx ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
        VITE_API_URL: https://api.app1.academia.ar
    container_name: app1-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VIRTUAL_HOST: app1.academia.ar
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: app1.academia.ar
      LETSENCRYPT_EMAIL: admin@academia.ar
    networks:
      - nginx-proxy
      - app1-internal
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  app1-db-data:
  media_files:

networks:
  nginx-proxy:
    external: true
  app1-internal:
    driver: bridge
